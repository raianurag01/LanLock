<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LanLock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect-src must allow the LAN backend (http for socket.io polling,
         ws for the websocket upgrade). Scheme-wide http:/ws: keeps it working
         when the backend's LAN IP changes between networks. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: ws:"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #1a1a1a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
